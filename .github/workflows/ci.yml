name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 11 is pinned via package.json's packageManager field —
      # corepack resolves the exact version on first invocation.
      - name: Enable corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      # LayoutProps/PageProps live in generated .next/types — materialize
      # them on the fresh checkout before tsc runs (no .next dir in CI).
      - name: Generate route types
        run: corepack pnpm exec next typegen

      - name: Typecheck
        run: corepack pnpm exec tsc --noEmit

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build
